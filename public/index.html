<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>战舰世界 · 资产管理器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2316324f'/%3E%3Cpath%20d='M16%205%20V25%20M8%2010%20H24%20M10%2018%20a6%206%200%200%200%2012%200%20M16%2025%20V28'%20stroke='%23ffffff'%20stroke-width='2.4'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#1a2433; --muted:#6b7a8d; --line:#e3e9f0;
  --blue:#2e86c1; --green:#1e9e57; --red:#e0506a; --gold:#e0a800; --purple:#8e44ad; --navy:#16324f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(135deg,#16324f,#1f4e79);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.8}
.hbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.28)}
.accbar{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;flex-wrap:wrap}
.acc-label{font-size:12px;opacity:.85}
.accbar select{background:#fff;color:var(--ink);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 9px;font-size:13px;max-width:200px}
.btn.sm{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.btn.sm:hover{background:rgba(255,255,255,.3)}
.bkhint{width:100%;font-size:12px;color:#ffe9a8;margin-top:4px}
nav#tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav#tabs button{flex:1;border:none;background:none;padding:12px 6px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-weight:600}
nav#tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
main{padding:16px;max-width:1100px;margin:0 auto;padding-bottom:80px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters input,.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}
.filters input[type=search]{flex:1;min-width:180px}
.filters .addbtn{padding:9px 14px;min-height:40px;border:1px solid var(--blue);border-radius:9px;font-size:14px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap}
.filters .addbtn:hover{filter:brightness(1.1)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.natgroup{margin-bottom:22px}
.nathead{font-weight:700;font-size:15px;margin:6px 2px 10px;display:flex;align-items:center;gap:8px;color:var(--navy)}
.nathead .cnt{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--bg,var(--card));color:var(--fg,#1a2433);border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:#bcd3e8;box-shadow:0 4px 14px rgba(30,80,140,.08)}
.card.dragging{opacity:.4}
.card.dragover{outline:2px dashed #1f4e79;outline-offset:-3px;background-image:none}
.card[draggable="true"]{cursor:grab}
.card[draggable="true"]:active{cursor:grabbing}
.card .mod,.card .barlabel,.card .cmd .sep,.card .fwchk,.card .cmd .cn{color:var(--fg,#1a2433)}
.card .mod{opacity:.82}
.card .barlabel{opacity:.78}
.card .cmd .sep{opacity:.82}
.card .fwchk{opacity:.9}
.card .cmd{border-top:1px dashed rgba(140,150,160,.45)}
.card .bar{background:rgba(140,150,160,.22)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sname{font-weight:700;font-size:15.5px;line-height:1.2}
.sname.prem{color:var(--gold)}
.typebadge{font-size:11px;background:#eaf2fb;color:var(--blue);padding:2px 7px;border-radius:6px;font-weight:600}
.lvbadge{font-size:12px;background:#f0f3f7;color:var(--ink);padding:2px 7px;border-radius:6px;font-weight:700}
.lvbadge.super{background:#2a2a2a;color:#ffd24a}
.mod{font-size:13px;color:var(--muted);margin-bottom:7px}
.mod .next{color:var(--purple);font-weight:600}
.bar{height:9px;background:#eef2f6;border-radius:6px;overflow:hidden;margin:4px 0 3px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:.3s}
.bar.done i{background:var(--green)}
.bar.cbar i{background:var(--purple)}
.barlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.tag.red{background:#fdeaee;color:var(--red)}
.tag.camo{background:#eef7ee;color:var(--green)}
.tag.fw{background:#eaf2fb;color:var(--blue)}
.tag.gun{background:#fff6dd;color:var(--gold)}
.tag.spec{background:#f1e6ff;color:var(--purple)}
.tag.grey{background:#eceff2;color:#8b97a4}
.cmd{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.cmd .crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cbadge{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:700;color:#fff}
.cbadge.legendary{background:var(--gold);color:#3a2c00}
.cbadge.special{background:var(--purple);color:#fff}
.cbadge.normal{background:#9aa7b5;color:#fff}
.cmd .cn{font-weight:600}
.cmd .sep{color:var(--muted);font-size:11.5px}
.elite{color:var(--gold);font-weight:700}
.fwchk{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;color:var(--muted);cursor:pointer}
.fwchk input{width:16px;height:16px}
.card.grey{opacity:.55;filter:grayscale(.4)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
/* charts */
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:14px}
.chart-card h4{margin:0 0 8px;font-size:14px}
.sub-note{font-size:12px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.ichart{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:8px 0 2px;color:var(--ink);align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend .lg.muted{color:var(--muted);font-weight:500}
.legend .lg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.ctip{position:absolute;background:rgba(22,50,79,.94);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;pointer-events:none;z-index:5;min-width:120px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ctip .tdate{font-weight:700;margin-bottom:3px;font-size:11.5px;opacity:.85}
.ctip .trow{display:flex;align-items:center;gap:5px;white-space:nowrap}
.ctip .trow i{width:9px;height:9px;border-radius:2px;display:inline-block}
/* 图表时间区间（全部/年/月/周）+ 横向拖动 */
.rgbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.rgb{padding:7px 15px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
.rgb:hover{border-color:var(--blue);color:var(--blue)}
.rgb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rgnav{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.rgnav:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.rgnav:disabled{opacity:.32;cursor:default}
.rgspan{font-size:12px;color:var(--muted);margin-left:2px}
.ichart.pannable{cursor:grab;touch-action:pan-y}
.ichart.pannable.grabbing{cursor:grabbing}
.ichart.pannable svg{user-select:none;-webkit-user-select:none}
@media(max-width:768px){
  .rgb{min-height:44px;padding:0 16px;font-size:15px}
  .rgnav{width:44px;height:44px;font-size:18px}
  .rgspan{width:100%;margin-left:0}
}
.pietip{position:fixed;background:rgba(22,50,79,.94);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;pointer-events:none;z-index:999;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25);line-height:1.5}
.caxisname{position:absolute;top:0;font-size:11px;color:var(--muted);transform:rotate(0deg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:9px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
/* focus board */
.fsection{margin-bottom:22px}
.fsection h3{font-size:14px;margin:0 0 10px;color:var(--navy);display:flex;align-items:center;gap:7px}
.frow{background:var(--bg,var(--card));color:var(--fg,#1a2433);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.frow.done{opacity:.6;background:var(--bg,#f4f6f8)}
.frow .finfo{flex:1;min-width:0}
.frow .fn{font-weight:700;font-size:14.5px}
.frow .fmeta{font-size:12px;color:var(--fg,#1a2433);opacity:.82;margin-top:2px}
.frow .fbar{height:7px;background:#eef2f6;border-radius:5px;overflow:hidden;margin-top:5px}
.frow .fbar i{display:block;height:100%;background:var(--blue)}
.frow input[type=checkbox]{width:20px;height:20px;flex:none}
.nbtag{display:inline-block;padding:1px 6px;border:1px solid currentColor;border-radius:4px;font-size:11px;line-height:1.5;opacity:.72;vertical-align:middle}
.addfollow{margin-top:10px}
.funfollow{flex:none;width:34px;height:34px;min-width:34px;padding:0;border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.55;transition:.15s}
.funfollow:hover{opacity:1;background:#dc3545;border-color:#dc3545;color:#fff}
@media(max-width:768px){.funfollow{width:44px;height:44px;min-width:44px}}
.addfollow button{padding:9px 14px;border:none;background:var(--blue);color:#fff;border-radius:8px;font-size:14px;cursor:pointer}
/* 自定义关注 - 模糊搜索选择 */
.fsbar{position:relative;display:flex;align-items:center}
.fsbar .fsic{position:absolute;left:11px;width:16px;height:16px;opacity:.45;pointer-events:none}
.fsbar input{flex:1;width:100%;box-sizing:border-box;padding:10px 40px 10px 34px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:transparent;color:inherit}
.fsbar input:focus{outline:none;border-color:var(--blue)}
.fsx{position:absolute;right:5px;width:30px;height:30px;border:none;background:transparent;color:inherit;opacity:.45;cursor:pointer;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0}
.fsx:hover{opacity:1;background:rgba(128,128,128,.18)}
.fslist{margin-top:8px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.fslist:empty{display:none}
.fsitem{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:44px;box-sizing:border-box;cursor:pointer;border-bottom:1px solid var(--line)}
.fsitem:last-child{border-bottom:none}
.fsitem:hover,.fsitem.on{background:rgba(46,134,193,.13)}
.fsflag{flex:none;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.fsnm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsmeta{flex:none;font-size:12px;opacity:.62;white-space:nowrap}
.fsplus{flex:none;width:18px;height:18px;opacity:.45}
.fsitem:hover .fsplus,.fsitem.on .fsplus{opacity:1;color:var(--blue)}
.fsempty{padding:12px;font-size:13px;opacity:.62;text-align:center}
.fstip{padding:8px 12px;font-size:12px;opacity:.55;text-align:center;border-top:1px solid var(--line)}
@media(max-width:768px){.fsitem{min-height:48px}.fsmeta{font-size:11px}.fslist{max-height:56vh}}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(20,35,55,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow:auto}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:15px;max-width:480px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .mclose{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.modal .row2{margin-top:4px}
.mbtn{margin-top:14px;display:flex;gap:8px}
.mbtn button{flex:1;padding:11px;border:none;border-radius:9px;font-size:15px;cursor:pointer;font-weight:600}
.mbtn .save{background:var(--blue);color:#fff}
.mbtn .del{background:#fdeaee;color:var(--red)}
.mbtn .cancel{background:#eef2f6;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(22,50,79,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:80}
#toast.show{opacity:1}
@media(max-width:768px){
  nav#tabs{position:fixed;bottom:0;left:0;right:0;top:auto;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
  nav#tabs button{padding:10px 2px;font-size:12px}
  main{padding:12px;padding-bottom:96px}
  .grid{grid-template-columns:1fr}
  .filters input[type=search]{min-width:100%}
  .filters .addbtn{width:100%;min-height:46px;font-size:15px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>战舰世界 · 资产管理器</h1>
    <div class="sub">全系别战舰 / 指挥官 / 虚拟资产 · 数据自动保存</div>
  </div>
  <div class="hbtns">
    <button class="btn" onclick="exportJSON()">导出 JSON</button>
    <button class="btn" onclick="document.getElementById('imp').click()">导入恢复</button>
    <button class="btn" onclick="clearAll()">清空账号</button>
    <input id="imp" type="file" accept="application/json" style="display:none" onchange="importJSON(event)">
  </div>
  <div class="accbar">
    <span class="acc-label">账号</span>
    <select id="accSel" onchange="switchAccount(this.value)"></select>
    <button class="btn sm" onclick="newAccount()">新建</button>
    <button class="btn sm" onclick="renameAccount()">重命名</button>
    <button class="btn sm" onclick="deleteAccount()">删除</button>
  </div>
  <div class="bkhint" id="bkhint"></div>
</header>
<nav id="tabs">
  <button data-v="fleet" onclick="switchView('fleet')">舰队</button>
  <button data-v="commanders" onclick="switchView('commanders')">舰长</button>
  <button data-v="assets" onclick="switchView('assets')">资产</button>
  <button data-v="overview" onclick="switchView('overview')">总览</button>
  <button data-v="focus" onclick="switchView('focus')">关注</button>
</nav>
<main id="view"></main>
<div class="modal-mask" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
const NATION_CN={'JP':'日本','US':'美国','USSR':'苏联','GER':'德国','UK':'英国','FR':'法国','IT':'意大利','PA':'泛亚','PE':'泛欧','NL':'荷兰','CW':'英联邦','PAN':'泛美','ESP':'西班牙'};
const NATION_ORDER=['日本','美国','苏联','德国','英国','法国','意大利','泛亚','泛欧','荷兰','英联邦','泛美','西班牙'];
/* 各系别配色：bg=卡片浅色底，solid=边框/图表色 */
const NATION_COL={'JP':{bg:'#fde8ea',solid:'#d6336c'},'US':{bg:'#d9e2f3',solid:'#1f4e79'},'USSR':{bg:'#f2d4d4',solid:'#b71c1c'},'GER':{bg:'#e2e2e2',solid:'#4a4a4a'},'UK':{bg:'#f6e7bf',solid:'#b8860b'},'FR':{bg:'#d4eefb',solid:'#2196c4'},'IT':{bg:'#d6efd9',solid:'#1e7a3c'},'PA':{bg:'#fae0e0',solid:'#e23b3b'},'PE':{bg:'#e3eefb',solid:'#5b9bd5'},'NL':{bg:'#ece0f5',solid:'#9b59b6'},'CW':{bg:'#d6eef0',solid:'#17a2b8'},'PAN':{bg:'#e8ddd0',solid:'#6b4423'},'ESP':{bg:'#fdf3c4',solid:'#d4a017'}};
const LVNUM={'I':1,'II':2,'III':3,'IV':4,'V':5,'VI':6,'VII':7,'VIII':8,'IX':9,'X':10};
/* 舰型代码 → 中文名（新增舰船时使用，与历史数据 typeName 取值保持一致） */
const TYPE_CN={'CV':'航母','BB':'战列','CA':'重巡','CL':'轻巡','DD':'驱逐','SS':'潜艇'};
function lvNum(s){return s.isSuper?11:(LVNUM[s.level]||0);}
/* 级别信息：超级舰=11(★)，其余按罗马数字 I~X → 1~10；异常 level(空/掺杂舰名)自动忽略，避免统计混乱 */
function levelInfo(s){if(s.isSuper)return{idx:11,roman:'★'};const m=String(s.level||'').match(/^[IVXLC]+/);if(!m)return null;const idx=LVNUM[m[0]];if(!idx)return null;return{idx:idx,roman:m[0]};}
function hexToRGB(hex){hex=(hex||'#888').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)];}
function lumRGB(r,g,b){return 0.2126*(r/255)+0.7152*(g/255)+0.0722*(b/255);}
function lum(hex){const c=hexToRGB(hex);return lumRGB(c[0],c[1],c[2]);}
function txtOn(hex){return lum(hex)<0.55?'#ffffff':'#1a2433';}
/* 较深系别底色（solid 的 75% + 白 25%），并据亮度自动选取卡片内文字/图形颜色 */
function natBg(code){const c=hexToRGB((NATION_COL[code]||{solid:'#888'}).solid);return 'rgb('+Math.round(c[0]*0.75+255*0.25)+','+Math.round(c[1]*0.75+255*0.25)+','+Math.round(c[2]*0.75+255*0.25)+')';}
function natFg(code){const c=hexToRGB((NATION_COL[code]||{solid:'#888'}).solid);const r=Math.round(c[0]*0.75+255*0.25),g=Math.round(c[1]*0.75+255*0.25),b=Math.round(c[2]*0.75+255*0.25);return lumRGB(r,g,b)<0.55?'#ffffff':'#1a2433';}
/* 去掉曲线图前导全为 0 的日期，使图表从首个有记录的数据点开始（新建账号同理） */
function trimLeading(series,dates){if(!dates||!dates.length)return{series:series,dates:dates};let start=0;for(let i=0;i<dates.length;i++){let any=false;for(const s of series){if(s&&s[i]>0){any=true;break;}}if(any){start=i;break;}}return{series:series.map(s=>s?s.slice(start):s),dates:dates.slice(start)};}

const RANGE_WIN={all:0,year:365,month:30,week:7};
const RANGE_LABEL={all:'全部',year:'年',month:'月',week:'周'};
const RANGE_KEYS=['all','year','month','week'];
const RANGE={assets:{mode:'all',off:0},overview:{mode:'all',off:0}};
function rgState(sec){if(!RANGE[sec])RANGE[sec]={mode:'all',off:0};return RANGE[sec];}
/* 把当前区间换算成索引窗口 [start,end)，并就地夹紧越界的 off */
function rgWindow(sec,total){
  const r=rgState(sec);const win=RANGE_WIN[r.mode]||0;
  if(!win||win>=total){r.off=0;return {start:0,end:total,win:total,maxOff:0};}
  const maxOff=total-win;
  if(!(r.off>=0))r.off=0;
  if(r.off>maxOff)r.off=maxOff;
  const end=total-r.off;
  return {start:end-win,end:end,win:win,maxOff:maxOff};
}
function rgApply(sec,dates,seriesArr){
  const w=rgWindow(sec,dates.length);
  return {dates:dates.slice(w.start,w.end),series:seriesArr.map(s=>s.slice(w.start,w.end)),w:w};
}
function setRange(sec,mode){const r=rgState(sec);if(r.mode===mode)return;r.mode=mode;r.off=0;rerender();}
function panRange(sec,days){const r=rgState(sec);if(r.mode==='all')return;r.off=r.off+days;rerender();}
function rangeBar(sec,dates){
  const r=rgState(sec);const w=rgWindow(sec,dates.length);
  const btns=RANGE_KEYS.map(m=>'<button class="rgb'+(r.mode===m?' on':'')+'" onclick="setRange(\''+sec+'\',\''+m+'\')">'+RANGE_LABEL[m]+'</button>').join('');
  const step=Math.max(1,Math.round(w.win/2));
  const canL=r.mode!=='all'&&r.off<w.maxOff, canR=r.mode!=='all'&&r.off>0;
  const nav='<button class="rgnav" '+(canL?'':'disabled')+' title="往更早平移" onclick="panRange(\''+sec+'\','+step+')">‹</button>'+
            '<button class="rgnav" '+(canR?'':'disabled')+' title="往更近平移" onclick="panRange(\''+sec+'\',-'+step+')">›</button>';
  const from=dates[w.start]||'',to=dates[w.end-1]||'';
  const tip=r.mode==='all'?'（已显示全部）':'（可按住曲线图横向拖动）';
  return '<div class="rgbar">'+btns+nav+'<span class="rgspan">'+esc(from)+' ~ '+esc(to)+' · 共 '+w.win+' 天 '+tip+'</span></div>';
}

/* 数据修改统计：按“凌晨3点”分界把修改计入当日或前一日（与首胜规则一致），并体现在图表中 */
function recordDaily(){ if(!state||!state.daily)return; const key=resetDayKey(); ensureTodayDaily(); const d=state.daily;
  // 统计口径必须与历史表(Excel 大号页)完全一致：全量统计，不按 purchased 过滤。
  // 未购买舰船的舰长依然存在并占有经验(106 艘未购舰中有 53 名舰长 xpNeed>0)，
  // 过滤会让"升级所需"凭空缩水，造成走势图在玩家未升级时发生跳变。
  const allShips=state.ships;
  const shipNeed=allShips.reduce((a,s)=>a+(s.xpNeed||0),0);
  const shipCur=allShips.reduce((a,s)=>a+(s.xpCur||0),0);
  const shipRem=allShips.reduce((a,s)=>a+Math.max(0,(s.xpNeed||0)-(s.xpCur||0)),0);
  const allCmds=state.commanders;
  const cmdNeedSum=allCmds.reduce((a,c)=>a+(c.xpNeed||0),0);   // 升级所需
  const cmdCurSum=allCmds.reduce((a,c)=>a+(c.xpCur||0),0);     // 现有经验
  const n=d.dates.length; const gold=d.gold[n-1]||0, silver=d.silver[n-1]||0, globalxp=d.globalxp[n-1]||0;
  // 历史遗留字段布局：cmdCur 位存"升级所需"、cmdRem 位存"现有经验"，
  // cmdNeed 位在全部 1907 天历史中恒为 0 且图表不读取，此处保持 0 以维持数组语义统一。
  const keys=['shipNeed','shipCur','shipRem','cmdNeed','cmdCur','cmdRem','gold','silver','globalxp'];
  const vals=[shipNeed,shipCur,shipRem,0,cmdNeedSum,cmdCurSum,gold,silver,globalxp];
  if(d.dates[n-1]===key){ keys.forEach((k,i)=>{ d[k][n-1]=vals[i]; }); }
  else { d.dates.push(key); keys.forEach((k,i)=>{ d[k].push(vals[i]); }); }
}

function autoRepair(d){
  if(!d||typeof d!=='object')d={};
  if(!Array.isArray(d.ships)||!d.ships.length)d.ships=JSON.parse(JSON.stringify(SEED.ships));
  if(!d.daily||typeof d.daily!=='object')d.daily=JSON.parse(JSON.stringify(SEED.daily));
  const seedShip={},seedCmd={};
  SEED.ships.forEach(s=>seedShip[s.id]=s);
  SEED.commanders.forEach(c=>seedCmd[c.id]=c);
  d.ships=d.ships.map(s=>{
    const base=seedShip[s.id]||{};
    const o=Object.assign({},base,s);
    ['id','col','xpNeed','xpCur','xpRem','cmdXpNeed','cmdXpCur','cmdXpRem','skillUsed','skillTotal','commanderId'].forEach(k=>{ if(o[k]===undefined||o[k]===null||o[k]==='')o[k]=(base[k]!==undefined?base[k]:0); });
    o.isPremium=!!o.isPremium;o.isSuper=!!o.isSuper;o.fullyUpgraded=!!o.fullyUpgraded;o.isElite=!!o.isElite;o.firstWin=!!o.firstWin;
    o.purchased=(s.purchased===false)?false:true;
    if(typeof o.name!=='string'||!o.name)o.name=base.name||('舰'+o.id);
    if(!o.nation)o.nation=base.nation||'JP';
    if(!o.type)o.type=base.type||'';
    if(!o.level)o.level=base.level||'';
    if(!o.cmdClass)o.cmdClass=base.cmdClass||'normal';
    if(!o.rankTitle)o.rankTitle=base.rankTitle||'';
    return o;
  });
  if(!Array.isArray(d.commanders)||!d.commanders.length)d.commanders=JSON.parse(JSON.stringify(SEED.commanders));
  // 规范化：Excel 数据中军衔常带“海军精英”后缀，统一剥离（是否精英由技能总数≥21 推导，无需文字展示）
  d.commanders.forEach(c=>{ if(typeof c.rankTitle==='string'&&c.rankTitle.indexOf('海军精英')>=0)c.rankTitle=c.rankTitle.replace(/海军精英/g,''); });
  const cmdMap={};d.commanders.forEach(c=>cmdMap[c.id]=c);
  d.ships.forEach(s=>{
    // 仅当该舰确实“配属了某舰长(id>0)”但舰长数据缺失时才重建（修复损坏数据）；
    // commanderId===0 / null / undefined 表示“无舰长”，绝不能据此凭空造一个新舰长。
    // 否则删除已配属舰长后，舰船.commanderId 被清空为 0，下次刷新 autoRepair 会误判为缺失、
    // 从种子数据复活一个一模一样的新舰长（表现为“删不掉 / 删了又生成”）。
    if(s.commanderId && !cmdMap[s.commanderId]){
      const sc=seedCmd[s.id];
      if(sc&&!cmdMap[sc.id]){d.commanders.push(JSON.parse(JSON.stringify(sc)));cmdMap[sc.id]=sc;s.commanderId=sc.id;}
      else{s.commanderId=s.id;if(!cmdMap[s.id]){const ns=d.ships.find(x=>x.id===s.id)||{};const nc={id:s.id,shipId:s.id,name:ns.name||'指挥官',cls:'normal',rankTitle:'',skillUsed:0,skillTotal:0,xpNeed:0,xpCur:0,xpRem:0};d.commanders.push(nc);cmdMap[s.id]=nc;}}
    }
  });
  // shipId===null 表示「预备役」（未配舰），必须原样保留。
  // 旧逻辑会把它改写成 c.id，指向一艘并不存在的舰船，导致该舰长在列表里被当成脏数据过滤掉而凭空消失。
  d.commanders.forEach(c=>{
    if(c.shipId===null)return;                                          // 预备役，保持不动
    if(c.shipId!==undefined&&d.ships.find(s=>s.id===c.shipId))return;   // 指针有效
    const sh=d.ships.find(s=>s.commanderId===c.id);
    c.shipId=sh?sh.id:null;                                             // 找不到归属就降为预备役，不再造幽灵 id
  });
  const dk=['dates','shipNeed','shipCur','shipRem','cmdNeed','cmdCur','cmdRem','gold','silver','globalxp'];
  dk.forEach(k=>{ if(!Array.isArray(d.daily[k]))d.daily[k]=(SEED.daily[k]||[]).slice(); });
  const n=d.daily.dates.length;
  // 长度对齐时缺失项继承前一日的值（不要补 0，否则会在走势图上砸出假的归零点）
  dk.forEach(k=>{ const a=d.daily[k];
    if(k==='dates'){ while(a.length>n)a.pop(); return; }
    while(a.length<n)a.push(a.length?a[a.length-1]:0);
    while(a.length>n)a.pop(); });
  if(!Array.isArray(d.customFollow))d.customFollow=[];
  if(!d.fwDone||typeof d.fwDone!=='object')d.fwDone={};
  d.ships.forEach((s,i)=>{if(typeof s.seq!=='number')s.seq=i;});
  return d;
}

/* utils */
function fmt(n){n=Math.round(n||0);return n.toLocaleString('en-US');}
function fmtBig(n){n=Math.round(n||0);if(n>=1e8)return (n/1e8).toFixed(2)+'亿';if(n>=1e4)return (n/1e4).toFixed(1)+'万';return n.toLocaleString('en-US');}
function pct(c,n){if(!n)return 0;return Math.max(0,Math.min(100,Math.round(c/n*100)));}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function findShip(id){return state.ships.find(s=>s.id===id);}
function findCmd(id){return state.commanders.find(c=>c.id===id);}
/* 新 id 取「舰船 ∪ 舰长」的全局最大值 +1：autoRepair 在异常时会用 ship.id 兜底当 commanderId，
   两个 id 空间共用一条水位线才不会撞车。 */
function nextId(){
  const a=state.ships.reduce((m,s)=>Math.max(m,+s.id||0),0);
  const b=state.commanders.reduce((m,c)=>Math.max(m,+c.id||0),0);
  return Math.max(a,b)+1;
}
/* 舰船对象里冗余存了一份舰长字段（历史 Excel 结构遗留），改动舰长后同步过去避免两处打架 */
function syncShipCmd(s,c){
  if(!s||!c)return;
  s.commanderId=c.id;s.cmdName=c.name;s.cmdClass=c.cls;s.rankTitle=c.rankTitle;
  s.skillUsed=c.skillUsed;s.skillTotal=c.skillTotal;s.isElite=c.skillTotal>=21;
  s.cmdXpNeed=c.xpNeed;s.cmdXpCur=c.xpCur;s.cmdXpRem=c.xpRem;
}
/* 解除舰长配属：清空舰船上冗余的舰长字段，并让其退回预备役 */
function clearShipCmd(s){
  if(!s)return;
  s.commanderId=0;s.cmdName='';s.cmdClass='normal';s.rankTitle='';
  s.skillUsed=0;s.skillTotal=0;s.isElite=false;
  s.cmdXpNeed=0;s.cmdXpCur=0;s.cmdXpRem=0;
}
/* 把舰长调到某舰：原舰长退回预备役，保持「一舰一舰长」不变式 */
function assignCmd(c,ship){
  if(!c||!ship)return;
  const old=findCmd(ship.commanderId);
  if(old&&old.id!==c.id)old.shipId=null;
  c.shipId=ship.id;syncShipCmd(ship,c);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function natCn(code){return NATION_CN[code]||code;}

/* 首胜：国服规则，每天凌晨3点重置 */
function dayKeyOf(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function resetDayKey(d){d=d||new Date();const x=new Date(d);if(x.getHours()<3){x.setDate(x.getDate()-1);}return dayKeyOf(x);}
function isFW(s){return state.fwDone && state.fwDone[s.id]===resetDayKey();}
/* 勾选/取消首胜后，只刷新“当前所在视图”，绝不切换板块。
   旧实现无条件调用 renderFocus()，会把舰队页内容整个换成关注页 → 看起来像莫名跳转。 */
function toggleFW(id){const k=resetDayKey();if(!state.fwDone)state.fwDone={};if(state.fwDone[id]===k)delete state.fwDone[id];else state.fwDone[id]=k;recordDaily();save();rerender();}

/* 保证 daily 数组末尾就是“当前游戏日”（按凌晨3点分界）。
   若末尾不是当前游戏日（跨天、或多日没打开过页面），则从最后记录日的次日起
   **逐日补齐**到当前游戏日，每补一天都继承前一日的数值（前向填充 forward-fill）。
   —— 没录入数据 ≠ 资产归零，未录入的日子视为“与前一日持平”，
      这样总览/资产板块和走势图都不会出现断崖式的 0。
   补齐终点是 resetDayKey()，所以绝不会落到未来日期（如未到 03:00 就误写次日）。
   返回补出的天数（0 表示无需补）。 */
const DAILY_COLS=['shipNeed','shipCur','shipRem','cmdNeed','cmdCur','cmdRem','gold','silver','globalxp'];
function ensureTodayDaily(){
  if(!state||!state.daily||!Array.isArray(state.daily.dates))return 0;
  const d=state.daily, key=resetDayKey();
  // 先把各列长度对齐到 dates：缺的用前一日的值补（无前值时才用 0）
  const n0=d.dates.length;
  DAILY_COLS.forEach(c=>{
    if(!Array.isArray(d[c]))d[c]=[];
    while(d[c].length<n0)d[c].push(d[c].length?d[c][d[c].length-1]:0);
    while(d[c].length>n0)d[c].pop();
  });
  if(!n0){ d.dates.push(key); DAILY_COLS.forEach(c=>d[c].push(0)); return 1; }
  const last=d.dates[n0-1];
  // YYYY-MM-DD 可直接字典序比较；末尾已是当日、或超前于当日（时钟回拨/手工改过），都不动
  if(last>=key)return 0;
  let added=0;
  const cur=new Date(last+'T12:00:00');            // 用正午构造，避开夏令时与时区边界
  for(let guard=0;guard<4000;guard++){
    cur.setDate(cur.getDate()+1);
    const k=dayKeyOf(cur);
    d.dates.push(k);
    DAILY_COLS.forEach(c=>{const a=d[c];a.push(a.length?a[a.length-1]:0);});  // 继承前一日
    added++;
    if(k>=key)break;
  }
  return added;
}

/* 打开页面 / 切换账号 / 跨天时调用：
   把「最后记录日 → 当前游戏日」之间的空缺逐日补齐（每日继承前一日），
   再用实时舰船/舰长数据刷新“当天”那一条，最后落盘。返回补出的天数。 */
function catchUpDaily(){
  if(!state||!state.daily)return 0;
  const added=ensureTodayDaily();
  if(added>0){ recordDaily(); save(); }
  return added;
}

/* 每日首胜重置监视器：页面常开时若跨越凌晨3点（游戏日切换），
   自动把全部“每日首胜”状态恢复为未完成，并刷新界面提示。 */
let _lastDayKey=null, _rolloverTimer=null;
function dayRolloverWatch(){
  if(!state||!state.daily)return;
  const k=resetDayKey();
  if(_lastDayKey===null){_lastDayKey=k;return;}
  if(k!==_lastDayKey){
    const before=(state.fwDone&&Object.keys(state.fwDone).length)||0;
    pruneFW();                       // 删除所有非当日的首胜记录 → 全部恢复为未完成
    _lastDayKey=k;
    const added=ensureTodayDaily();  // 新的一天：建条目并继承前一日数据（不归零）
    if(added>0)recordDaily();
    if(before>0||added>0){ save(); render(); }
    if(before>0)toast('每日首胜已重置为未完成');
  }
}
function startRolloverWatch(){
  if(_rolloverTimer)return;          // 仅启动一次
  _lastDayKey=resetDayKey();
  _rolloverTimer=setInterval(dayRolloverWatch,30000);
}

/* ---------- 曲线图横向拖动 ----------
   监听器挂在 document 上：拖动过程中会重绘整个视图（图表元素被替换），
   若把 mousemove/mouseup 挂在图表元素上，元素一被替换手势就断了。 */
let PANST=null;
function chartPanStart(clientX,c,el){
  if(!c.pan)return;
  const r=rgState(c.pan);const win=RANGE_WIN[r.mode]||0;
  if(!win)return;                                  // “全部”区间无可平移空间
  const svg=el.querySelector('svg');if(!svg)return;
  const rect=svg.getBoundingClientRect();
  const plotPx=rect.width*(c.W-c.padL-c.padR)/c.W; // 绘图区实际像素宽
  const pxPerDay=plotPx/Math.max(1,c.n-1);
  if(!(pxPerDay>0))return;
  PANST={sec:c.pan,startX:clientX,startOff:r.off,pxPerDay:pxPerDay,maxOff:Math.max(0,(c.panTotal||0)-win),moved:false};
  el.classList.add('grabbing');
  document.addEventListener('mousemove',chartPanMove);
  document.addEventListener('mouseup',chartPanEnd);
  document.addEventListener('touchmove',chartPanTouchMove,{passive:false});
  document.addEventListener('touchend',chartPanEnd);
  document.addEventListener('touchcancel',chartPanEnd);
}
function chartPanTo(clientX){
  if(!PANST)return;
  const dx=clientX-PANST.startX;
  let want=PANST.startOff+Math.round(dx/PANST.pxPerDay); // 向右拖 → 看更早的数据 → off 增大
  if(want<0)want=0;
  if(want>PANST.maxOff)want=PANST.maxOff;
  const r=rgState(PANST.sec);
  if(want===r.off)return;
  r.off=want;PANST.moved=true;
  rerender();
}
function chartPanMove(e){chartPanTo(e.clientX);}
function chartPanTouchMove(e){if(!PANST||e.touches.length!==1)return;e.preventDefault();chartPanTo(e.touches[0].clientX);}
function chartPanEnd(){
  PANST=null;
  const g=document.querySelectorAll('.ichart.grabbing');for(let i=0;i<g.length;i++)g[i].classList.remove('grabbing');
  document.removeEventListener('mousemove',chartPanMove);
  document.removeEventListener('mouseup',chartPanEnd);
  document.removeEventListener('touchmove',chartPanTouchMove);
  document.removeEventListener('touchend',chartPanEnd);
  document.removeEventListener('touchcancel',chartPanEnd);
}
function bindCharts(){
  CHARTS.forEach(c=>{
    const el=document.getElementById('ichart_'+c.id);if(!el)return;
    const svg=el.querySelector('svg');const hov=el.querySelector('#hov_'+c.id);
    const hl=el.querySelector('#hl_'+c.id);const dots=el.querySelector('#dots_'+c.id);
    const tip=el.querySelector('#tip_'+c.id);
    if(c.pan){
      el.onmousedown=function(e){if(e.button!==0)return;e.preventDefault();chartPanStart(e.clientX,c,el);};
      el.ontouchstart=function(e){if(e.touches.length===1)chartPanStart(e.touches[0].clientX,c,el);};
    }
    el.onmousemove=function(e){if(PANST)return;const r=svg.getBoundingClientRect();
      const fx=(e.clientX-r.left)/r.width;
      let i=Math.round((fx*c.W-c.padL)/(c.W-c.padL-c.padR)*(c.n-1));
      if(i<0)i=0;if(i>c.n-1)i=c.n-1;
      const x=c.padL+(c.n<=1?0:i/(c.n-1))*(c.W-c.padL-c.padR);
      hl.setAttribute('x1',x);hl.setAttribute('x2',x);hov.style.display='';
      let ds='';const lines=[];
      c.series.forEach(s=>{const v=s.data[i];const y=c.H-c.padB-(v-c.yMin)/(c.yMax-c.yMin)*(c.H-c.padT-c.padB);
        ds+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.6" fill="'+s.color+'" stroke="#fff" stroke-width="1"/>';
        lines.push('<div class="trow"><i style="background:'+s.color+'"></i>'+esc(s.name)+'：<b>'+fmt(s.data[i])+'</b></div>');});
      dots.innerHTML=ds;
      tip.innerHTML='<div class="tdate">'+(c.dates[i]||'')+'</div>'+lines.join('');
      tip.style.display='block';
      const tw=tip.offsetWidth;let tx=x/c.W*r.width-tw/2;if(tx<0)tx=0;if(tx>r.width-tw)tx=r.width-tw;
      tip.style.left=tx+'px';tip.style.top=(c.padT-2)+'px';
    };
    el.onmouseleave=function(){hov.style.display='none';tip.style.display='none';};
  });
}

/* 搜索输入法(IME)友好：组字过程中不重绘（避免中文输入被打断）；重绘后恢复焦点与光标到末尾 */
let _searchComposing=false,_searchRefocusId=null;
function onSearchInput(el,view,e){const st=(view==='fleet'?(state._f=state._f||{}):(state._cf=state._cf||{}));st.q=el.value;
  // 组字进行中（输入法候选未确认）：只记录关键词、不刷新，避免中文输入被打断
  if(e&&e.isComposing){_searchComposing=true;return;}

  // （兼容部分输入法/浏览器不触发 compositionend、仅靠尾部 input 提交的情况，防止标记卡死导致搜索永不刷新）
  if(_searchComposing){_searchComposing=false;if(view==='fleet')refreshFleetList();else refreshCmdList();return;}
  // 普通输入（无输入法）：只刷新列表（不重建搜索框，保持焦点与输入法状态稳定，确保实时过滤）
  if(view==='fleet')refreshFleetList();else refreshCmdList();}
function afterSearchRender(){if(_searchRefocusId){const el=document.getElementById(_searchRefocusId);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}_searchRefocusId=null;}}
function renderFleet(){const f=state._f||{};const q=(f.q||'').toLowerCase();const nat=f.nat||'';const status=f.status||'';

  let html='<div class="filters"><input type="search" id="fleetSearch" placeholder="搜索舰名 / 类型 / 系别" value="'+esc(f.q||'')+'" oninput="onSearchInput(this,\'fleet\',event)" oncompositionstart="_searchComposing=true" oncompositionend="_searchComposing=false;onSearchInput(this,\'fleet\',event)">'+
    '<select onchange="state._f=state._f||{};state._f.nat=this.value;_searchRefocusId=\'fleetSearch\';renderFleet()">'+natOpt+'</select>'+
    '<select onchange="state._f=state._f||{};state._f.status=this.value;_searchRefocusId=\'fleetSearch\';renderFleet()">'+statOpt+'</select>'+

    grp.forEach(s=>html+=shipCard(s));html+='</div></div>';});
  html+='</div>';
  html+='</div>';
  document.getElementById('view').innerHTML=html;afterSearchRender();
}
function buildFleetList(){const f=state._f||{};const q=(f.q||'').toLowerCase();const nat=f.nat||'';const status=f.status||'';
  let ships=state.ships.filter(s=>{
    if(q&&!(s.name.toLowerCase().includes(q)||s.type.toLowerCase().includes(q)||natCn(s.nation).includes(q)))return false;
    if(nat&&s.nation!==nat)return false;
    if(status==='research'&&(!s.purchased||!s.shipModule))return false;
    if(status==='fully'&&!s.fullyUpgraded)return false;
    if(status==='notbuy'&&s.purchased)return false;
    if(status==='premium'&&!s.isPremium)return false;
    if(status==='spec'&&!(s.isPremium&&s.level==='X'))return false;
    return true;});
  if(!ships.length)return '<div class="empty">没有匹配的舰艇</div>';
  let html='<div class="natgroups">';
  NATION_ORDER.forEach(n=>{let grp=ships.filter(s=>natCn(s.nation)===n);if(!grp.length)return;
    grp.sort((a,b)=>lvNum(a)-lvNum(b)||(a.seq-b.seq));
    const code=Object.keys(NATION_CN).find(c=>NATION_CN[c]===n);const col=NATION_COL[code]||{solid:'#888'};
    html+='<div class="natgroup"><div class="nathead" style="border-left:4px solid '+col.solid+';color:'+col.solid+'">'+n+'<span class="cnt">'+grp.length+' 艘</span></div><div class="grid">';
    grp.forEach(s=>html+=shipCard(s));html+='</div></div>';});
  html+='</div>';
  return html;}
function refreshFleetList(){const el=document.getElementById('fleetList');if(el)el.innerHTML=buildFleetList();}

/* 舰队卡片拖拽排序：仅允许同系别、同级别之间调整，保持与游戏服务器一致 */
function onDragStart(e){const el=e.currentTarget;_dragId=+el.getAttribute('data-id');_dragNat=el.getAttribute('data-nat');_dragLv=el.getAttribute('data-lv');el.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragOver(e){const el=e.currentTarget;if(_dragId==null)return;const id=+el.getAttribute('data-id');if(id===_dragId)return;if(el.getAttribute('data-nat')===_dragNat&&el.getAttribute('data-lv')===_dragLv){e.preventDefault();el.classList.add('dragover');}}
function onDragLeave(e){e.currentTarget.classList.remove('dragover');}
function onDrop(e){const el=e.currentTarget;e.preventDefault();el.classList.remove('dragover');const targetId=+el.getAttribute('data-id');if(_dragId==null||_dragId===targetId){_dragId=null;return;}reorderShip(_dragId,targetId);_dragId=null;}
function onDragEnd(e){e.currentTarget.classList.remove('dragging');_dragging=true;setTimeout(function(){_dragging=false;},60);}
function reorderShip(dragId,targetId){const d=findShip(dragId);if(!d)return;const group=state.ships.filter(s=>s.nation===d.nation&&lvNum(s)===lvNum(d));const ids=group.map(s=>s.id);const from=ids.indexOf(dragId);const to=ids.indexOf(targetId);if(from<0||to<0)return;ids.splice(from,1);ids.splice(to,0,dragId);ids.forEach((id,i)=>{const sh=findShip(id);if(sh)sh.seq=i;});save();renderFleet();toast('已调整该舰排序');}

function renderCommanders(){const f=state._cf||{};const q=(f.q||'').toLowerCase();const cls=f.cls||'';const own=f.own||'';

  // shipId 为空 = 预备役舰长（未配舰），同样要展示；只有指向不存在舰船的脏指针才隐藏。

    const ship=c.shipId?findShip(c.shipId):null;

    '<button class="addbtn" onclick="openNewCmd()">＋ 新增舰长</button></div>';
  html+='<div id="cmdList">';
  if(!cmds.length){html+='<div class="empty">没有匹配的舰长</div>';html+='</div>';document.getElementById('view').innerHTML=html;afterSearchRender();return;}
  html+='<div class="grid">';
  cmds.forEach(c=>{const ship=findShip(c.shipId);const isElite=c.skillTotal>=21;
    const nat=ship?ship.nation:null;const col=nat?NATION_COL[nat]:{bg:'#fff',solid:'#ccc'};const bg=nat?natBg(nat):'#fff',fg=nat?natFg(nat):'#1a2433';
    const cneed=c.xpNeed,ccur=c.xpCur,crem=c.xpRem;const cdflag=cneed>0;
    html+='<div class="card" onclick="openCmd('+c.id+')" style="background:'+bg+';color:'+fg+';border-left:4px solid '+col.solid+'">'+
      '<div class="top"><div class="sname"><span class="cbadge '+c.cls+'">'+(c.cls==='legendary'?'传奇':c.cls==='special'?'特殊':'普通')+'</span> '+esc(c.name)+'</div></div>'+
      '<div class="mod">所在舰船：'+(ship?esc(ship.name)+(ship.purchased?'':' <span class="nbtag">未购舰</span>'):'<span class="nbtag">预备役 · 未配舰</span>')+'</div>'+

      '<div class="mod">技能：'+c.skillUsed+'/'+c.skillTotal+'</div>'+
      '<div class="bar cbar"><i style="width:'+pct(ccur,cneed)+'%"></i></div><div class="barlabel"><span>'+(cdflag?('经验 '+fmt(ccur)+' / '+fmt(cneed)):'经验 '+fmt(ccur))+'</span><span>'+(cdflag?('还需 '+fmt(crem)):'已满级')+'</span></div>'+

function renderAssets(){const d=state.daily;const n=d.dates.length;
  const latest=g=>d[g][n-1];
  const cards='<div class="stats">'+
    '<div class="stat" style="cursor:pointer" title="点击修改最新总额" onclick="editAsset(\'gold\')"><div class="v" style="color:var(--gold)">'+fmt(latest('gold'))+'</div><div class="l">金币（最新 · 点击修改）</div></div>'+
    '<div class="stat" style="cursor:pointer" title="点击修改最新总额" onclick="editAsset(\'silver\')"><div class="v" style="color:var(--green)">'+fmtBig(latest('silver'))+'</div><div class="l">银币（最新 · 点击修改）</div></div>'+
    '<div class="stat" style="cursor:pointer" title="点击修改最新总额" onclick="editAsset(\'globalxp\')"><div class="v" style="color:var(--blue)">'+fmtBig(latest('globalxp'))+'</div><div class="l">全局经验（最新 · 点击修改）</div></div>'+
    '</div>';
  // 三条资产曲线共用同一时间域（统一裁掉开头尚未记录的空白期），保证区间切换与拖动完全同步
  const aT=trimLeading([d.gold,d.silver,d.globalxp],d.dates);
  const R=rgApply('assets',aT.dates,aT.series);
  const bar=rangeBar('assets',aT.dates);
  const rdates=downsample(R.dates,500);
  const mkAsset=(title,name,color,arr)=>'<div class="chart-card"><h4>'+title+'（悬浮查看当日数值）</h4>'+
    interactiveChart([{name:name,color:color,data:downsample(arr,500)}],
      {dates:rdates,yname:name,h:200,id:'asset_'+name,pan:'assets',panTotal:aT.dates.length})+
    '</div>';
  const chart=mkAsset('金币 · 每日存量','金币','#e0a800',R.series[0])+
    mkAsset('银币 · 每日存量','银币','#1e9e57',R.series[1])+
    mkAsset('全局经验 · 每日存量','全局经验','#2e86c1',R.series[2]);
  document.getElementById('view').innerHTML=cards+bar+chart;
}
function downsample(arr,max){if(arr.length<=max)return arr.slice();const step=Math.ceil(arr.length/max);const out=[];for(let i=0;i<arr.length;i+=step)out.push(arr[i]);if((out.length-1)*step<arr.length-1)out.push(arr[arr.length-1]);return out;}
/* 资产三种虚拟货币总额：点击手动修改最新一日的值，并计入当日数据统计 */
function editAsset(g){if(!state||!state.daily||!state.daily[g])return;ensureTodayDaily();const d=state.daily;const n=d.dates.length;const cur=d[g][n-1]||0;const label={gold:'金币',silver:'银币',globalxp:'全局经验'}[g]||g;const v=prompt('修改「'+label+'」最新总额（当前 '+fmt(cur)+'）：',String(cur));if(v===null)return;const num=Number(v);if(isNaN(num)){toast('请输入有效数字');return;}d[g][n-1]=Math.round(num);recordDaily();save();renderAssets();toast('已更新'+label+'总额');}

  /* 舰长经验走势：历史 daily 数组(QY14:CMG16) 语义为 cmdCur=升级所需、cmdRem=现有经验、剩余=cmdCur-cmdRem；
     历史之后的数据由 recordDaily 按同一语义写入（cmdCur=升级所需、cmdRem=现有经验），并体现在图表中 */
  const cmdNeedSeries=d.cmdCur;

    {name:'现有经验',color:'#2e86c1',data:downsample(R.series[1],500)},
    {name:'剩余所需',color:'#e0506a',data:downsample(R.series[2],500)}
  ],{dates:rdates,yname:'舰船经验',h:230,id:'ovShip',pan:'overview',panTotal:ovT.dates.length});
  const cmdOverlay=interactiveChart([

  // 系别柱状图（仅已拥有，按系别配色）；条形上方数值由 barSVG 统一呈现
  const natItems=Object.keys(NATION_CN).map(code=>{const c=purchased.filter(s=>s.nation===code).length;return {label:NATION_CN[code],value:c,color:NATION_COL[code].solid};}).filter(i=>i.value>0);

/* ---------- focus (req2: independent board) ---------- */
function focusAuto(){const out=[];
  state.ships.forEach(s=>{if(!s.purchased)return;if(s.fullyUpgraded||!s.shipModule)return;if(s.xpRem<=0)return;
    out.push(s);});
  out.sort((a,b)=>a.xpRem-b.xpRem);
  return out.slice(0,12);}
function followSet(){return new Set(state.customFollow||[]);}
function renderFocus(){const auto=focusAuto();const fs=followSet();
  const autoHtml=auto.map(s=>focusRow(s)).join('')||'<div class="empty">没有接近升级的舰艇</div>';
  // custom = customFollow not already in auto; 完全体（可用于PVE）排在最前，其余按还需经验升序
  const isFull=s=>(s.fullyUpgraded||(!s.xpNeed&&!s.xpCur&&!s.shipModule));
  const customAll=state.ships.filter(s=>s.purchased&&fs.has(s.id)&&!auto.find(a=>a.id===s.id));
  const fullC=customAll.filter(isFull).sort((a,b)=>a.xpRem-b.xpRem);
  const restC=customAll.filter(s=>!isFull(s)).sort((a,b)=>a.xpRem-b.xpRem);
  const custom=fullC.concat(restC);
  const customHtml=custom.map(s=>focusRow(s,true)).join('')||'<div class="empty">暂无自定义关注，可在下方添加</div>';
  // add: 模糊搜索选择（候选=已购买且不在自动区、不在关注列表中的舰船）
  document.getElementById('view').innerHTML=
    '<div class="fsection"><h3>★ 我的关注（自定义）</h3>'+customHtml+
      '<div class="addfollow"><div class="fsbar">'+
        '<svg class="fsic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16.5 16.5" stroke-linecap="round"/></svg>'+

/* 可搜索文本：舰名 / 系别中文+代码 / 等级 / 舰型中文+代码 / 舰长名 / 金币·超级标签 */
function fsHay(s){return [s.name,natCn(s.nation),s.nation,(s.isSuper?'★ 超级 超级舰':'L'+s.level),s.level,
  s.typeCN||'',s.typeName||'',s.type||'',s.cmdName||'',(s.isPremium?'金币船 金币':'')]
  .join(' ').replace(/\s+/g,' ').toLowerCase();}
function fsPool(){const auto=focusAuto();const fs=followSet();
  const used=new Set(auto.map(s=>s.id).concat(Array.from(fs)));
  return state.ships.filter(s=>s.purchased&&!used.has(s.id));}
function fsRank(s,t){if(!t)return 2;const n=(s.name||'').toLowerCase();
  if(n.indexOf(t)===0)return 0;if(n.indexOf(t)>=0)return 1;return 2;}
function fsMatch(pool,q){
  const toks=(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list=pool;
  if(toks.length){list=pool.filter(s=>{const h=fsHay(s);return toks.every(t=>h.indexOf(t)>=0);});}
  const first=toks[0]||'';
  return list.slice().sort((a,b)=>{const ra=fsRank(a,first),rb=fsRank(b,first);
    if(ra!==rb)return ra-rb;return String(a.name).localeCompare(String(b.name),'zh');});
}
function fsFilter(){
  const box=document.getElementById('fsList');if(!box)return;
  const inp=document.getElementById('fsq');if(inp&&typeof inp.value==='string')fsQuery=inp.value;
  // 搜索框为空时不展示任何推荐列表，直接收起，保留版面紧凑（下方仍是「即将升级」列表）
  if(!fsQuery||!fsQuery.trim()){ box.innerHTML=''; fsIdx=-1; return; }
  const pool=fsPool();const res=fsMatch(pool,fsQuery);const shown=res.slice(0,FS_MAX);
  if(fsIdx>=shown.length)fsIdx=shown.length-1;
  if(!shown.length){
    box.innerHTML='<div class="fsempty">'+(pool.length
      ?('没有匹配「'+esc(fsQuery.trim())+'」的可添加舰船')
      :'已购舰船都在关注列表里了')+'</div>';
    return;}
  box.innerHTML=shown.map((s,i)=>{
    const bg=natBg(s.nation),fg=natFg(s.nation);
    return '<div class="fsitem'+(i===fsIdx?' on':'')+'" onclick="addFollow('+s.id+')" title="加入自定义关注">'+
      '<span class="fsflag" style="background:'+bg+';color:'+fg+'">'+esc(natCn(s.nation))+'</span>'+
      '<span class="fsnm">'+esc(s.name)+'</span>'+
      '<span class="fsmeta">'+(s.isSuper?'★':esc(String(s.level||'-')))+' · '+esc(s.typeCN||s.type||'')+(s.isPremium?' · 金币':'')+'</span>'+
      '<svg class="fsplus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'+
      '</div>';}).join('')
    +(res.length>FS_MAX?'<div class="fstip">还有 '+(res.length-FS_MAX)+' 艘未显示，继续输入可缩小范围</div>':'');
}
function fsKey(e){
  const box=document.getElementById('fsList');if(!box)return;
  const items=box.querySelectorAll?box.querySelectorAll('.fsitem'):[];
  const n=items.length;const k=e.key;
  if(k==='ArrowDown'||k==='ArrowUp'){
    if(e.preventDefault)e.preventDefault();if(!n)return;
    fsIdx=fsIdx<0?(k==='ArrowDown'?0:n-1):fsIdx+(k==='ArrowDown'?1:-1);
    if(fsIdx<0)fsIdx=n-1;if(fsIdx>=n)fsIdx=0;
    for(let i=0;i<n;i++)items[i].classList.toggle('on',i===fsIdx);
    if(items[fsIdx]&&items[fsIdx].scrollIntoView)items[fsIdx].scrollIntoView({block:'nearest'});
  }else if(k==='Enter'){
    if(e.preventDefault)e.preventDefault();if(!n)return;
    const t=items[fsIdx>=0?fsIdx:0];if(t&&t.click)t.click();
  }else if(k==='Escape'){
    if(e.preventDefault)e.preventDefault();fsClear();}
}
function fsClear(){fsQuery='';fsIdx=-1;const inp=document.getElementById('fsq');
  if(inp){inp.value='';if(inp.focus)inp.focus();}fsFilter();}
function focusRow(s,canRemove){const need=s.xpNeed,cur=s.xpCur,rem=s.xpRem;const done=isFW(s);
  const bg=natBg(s.nation),fg=natFg(s.nation);
  const bar=done?'<div class="fbar"><i style="width:100%;background:#9aa7b5"></i></div>':'<div class="fbar"><i style="width:'+pct(cur,need)+'%"></i></div>';
  return '<div class="frow'+(done?' done':'')+'" onclick="openShip('+s.id+')" style="background:'+bg+';color:'+fg+'">'+
    '<input type="checkbox" '+(done?'checked':'')+' onclick="event.stopPropagation();toggleFW('+s.id+')">'+
    '<div class="finfo"><div class="fn">'+esc(s.name)+' <span style="color:inherit;opacity:.7;font-weight:400;font-size:12px">'+natCn(s.nation)+' L'+(s.isSuper?'★':s.level)+'</span></div>'+
    '<div class="fmeta">'+(s.shipModule?('研发：'+esc(s.shipModule)+' · '):'')+'现有 '+fmt(cur)+' / 需 '+fmt(need)+' · 还需 '+fmt(rem)+'</div>'+bar+'</div>'+
    (canRemove?'<button class="funfollow" title="从关注列表移除（不会删除该舰船）" onclick="event.stopPropagation();unfollow('+s.id+')"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>':'')+
    '</div>';}
/* 加入自定义关注（仅改 customFollow，不改舰船本体） */
function addFollow(id){
  if(id===undefined||id===null){const sel=document.getElementById('addFollow');if(!sel||!sel.value)return;id=sel.value;}
  id=parseInt(id);if(isNaN(id))return;
  const s=findShip(id);if(!s)return;
  if(!state.customFollow)state.customFollow=[];
  if(state.customFollow.indexOf(id)<0)state.customFollow.push(id);
  fsIdx=-1;fsWantFocus=true;
  save();renderFocus();
  toast('已加入关注：'+s.name);}
/* 仅从自定义关注列表移除，绝不删除舰船本体 */
function unfollow(id){if(!state.customFollow)return;id=parseInt(id);
  const i=state.customFollow.indexOf(id);if(i<0)return;
  const s=findShip(id);
  state.customFollow.splice(i,1);save();renderFocus();
  toast('已从关注列表移除' + (s?('：'+s.name):'') + '（舰船未删除）');}

/* ---------- modals ---------- */
function openShip(id){const s=findShip(id);if(!s)return;const cmd=findCmd(s.commanderId);
  const isElite=cmd&&cmd.skillTotal>=21;
  const swapOpts='<option value="0" '+(!s.commanderId?'selected':'')+'>无舰长（解除配属）</option>'+state.commanders.map(c=>{const sh=c.shipId?findShip(c.shipId):null;return '<option value="'+c.id+'" '+(c.id===s.commanderId?'selected':'')+'>'+esc(c.name)+' @ '+(sh?esc(sh.name):'预备役')+'</option>';}).join('');
  const html='<span class="mclose" onclick="closeModal()">×</span><h3>'+esc(s.name)+' <span style="font-size:12px;color:var(--muted)">'+natCn(s.nation)+' L'+(s.isSuper?'★':s.level)+' · '+(s.isPremium?(s.level==='X'?'特种船':'金币船'):'')+'</span></h3>'+
    '<div class="row2"><div class="field"><label>舰型</label><input id="mType" value="'+esc(s.type)+'"></div><div class="field"><label>主炮/武器</label><input id="mGun" value="'+esc(s.gun)+'"></div></div>'+
    '<div class="field"><label>升级模块 / 研发下一舰</label><input id="mMod" value="'+esc(s.shipModule)+'"></div>'+
    '<div class="row2"><div class="field"><label>升级所需经验</label><input id="mSNeed" type="number" value="'+s.xpNeed+'" oninput="recalcShip()"></div><div class="field"><label>现有经验</label><input id="mSCur" type="number" value="'+s.xpCur+'" oninput="recalcShip()"></div></div>'+
    '<div class="field"><label>还需经验（自动计算）</label><input id="mSRem" type="number" value="'+s.xpRem+'" disabled></div>'+
    '<div class="field"><label>涂装</label><input id="mCamo" value="'+esc(s.camo)+'"></div>'+
    '<div class="row2"><div class="field"><label>是否购买</label><select id="mBuy"><option value="1" '+(s.purchased?'selected':'')+'>已购买</option><option value="0" '+(!s.purchased?'selected':'')+'>未购买</option></select></div><div class="field"><label>今日首胜</label><select id="mFW"><option value="1" '+(isFW(s)?'selected':'')+'>已完成</option><option value="0" '+(!isFW(s)?'selected':'')+'>未完成</option></select></div></div>'+
    '<div class="row2"><div class="field"><label>船种</label><select id="mPrem"><option value="0" '+(!s.isPremium?'selected':'')+'>普通研发船（银币）</option><option value="1" '+(s.isPremium?'selected':'')+'>金币 / 特种船</option></select></div><div class="field"><label>超级舰（★）</label><select id="mSuper"><option value="0" '+(!s.isSuper?'selected':'')+'>否</option><option value="1" '+(s.isSuper?'selected':'')+'>是</option></select></div></div>'+
    (cmd?'<hr style="border:none;border-top:1px solid var(--line);margin:14px 0"><h3 style="font-size:14px">指挥官（可换舰）</h3>'+
      '<div class="field"><label>更换指挥官</label><select id="mSwap" onchange="swapCmd('+s.id+',this.value)">'+swapOpts+'</select></div>'+
      '<div class="row2"><div class="field"><label>舰长名</label><input id="mcName" value="'+esc(cmd.name)+'"></div><div class="field"><label>类别</label><select id="mcCls"><option value="legendary" '+(cmd.cls==='legendary'?'selected':'')+'>传奇</option><option value="special" '+(cmd.cls==='special'?'selected':'')+'>特殊</option><option value="normal" '+(cmd.cls==='normal'?'selected':'')+'>普通</option></select></div></div>'+
      '<div class="field"><label>军衔</label><input id="mcRank" value="'+esc(cmd.rankTitle)+'"></div>'+
      '<div class="row2"><div class="field"><label>技能已用</label><input id="mcSU" type="number" value="'+cmd.skillUsed+'"></div><div class="field"><label>技能总数</label><input id="mcST" type="number" value="'+cmd.skillTotal+'"></div></div>'+
      '<div class="row2"><div class="field"><label>舰长所需经验</label><input id="mcN" type="number" value="'+cmd.xpNeed+'"></div><div class="field"><label>舰长现有经验</label><input id="mcC" type="number" value="'+cmd.xpCur+'"></div></div>'+
      '<div class="field" style="color:var(--muted);font-size:12px">'+''+'</div>'
    :'')+
    '<div class="mbtn"><button class="save" onclick="saveShip('+id+')">保存</button><button class="del" onclick="delShip('+id+')">删除</button><button class="cancel" onclick="closeModal()">取消</button></div>';
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function recalcShip(){const n=+document.getElementById('mSNeed').value||0;const c=+document.getElementById('mSCur').value||0;document.getElementById('mSRem').value=Math.max(0,n-c);}
function swapCmd(shipId,cmdId){const s=findShip(shipId);if(!s)return;const cid=parseInt(cmdId);
  if(!cid){ // 选「无舰长」：解除当前配属，旧舰长退回预备役
    const old=findCmd(s.commanderId); if(old)old.shipId=null;
    clearShipCmd(s); save();openShip(shipId);toast('已解除指挥官配属');return;
  }
  const tgtCmd=findCmd(cid);if(!tgtCmd)return;const tgtShip=findShip(tgtCmd.shipId);
  const oldCmdId=s.commanderId;const oldCmd=findCmd(oldCmdId);
  s.commanderId=parseInt(cmdId);
  if(tgtShip&&tgtShip.id!==s.id){tgtShip.commanderId=oldCmdId;}
  // keep commander.shipId pointers consistent
  tgtCmd.shipId=s.id;
  // 换上的若是预备役舰长（tgtShip 不存在），被替下的旧舰长就没有舰可去，应退回预备役而非留下错指针
  if(oldCmd&&oldCmd.id!==tgtCmd.id)oldCmd.shipId=tgtShip?tgtShip.id:null;
  syncShipCmd(s,tgtCmd);
  if(tgtShip&&oldCmd&&tgtShip.id!==s.id)syncShipCmd(tgtShip,oldCmd);
  save();openShip(shipId);toast(tgtShip?'已更换指挥官':'已从预备役调入指挥官');}
function saveShip(id){const s=findShip(id);if(!s)return;
  s.type=document.getElementById('mType').value;s.gun=document.getElementById('mGun').value;
  s.shipModule=document.getElementById('mMod').value;s.xpNeed=+document.getElementById('mSNeed').value||0;
  s.xpCur=+document.getElementById('mSCur').value||0;s.xpRem=Math.max(0,s.xpNeed-s.xpCur);
  s.fullyUpgraded=(!s.shipModule&&!s.xpNeed&&!s.xpCur&&!s.xpRem);
  s.camo=document.getElementById('mCamo').value;s.purchased=document.getElementById('mBuy').value==='1';
  s.isPremium=document.getElementById('mPrem').value==='1';s.isSuper=document.getElementById('mSuper').value==='1';
  const k=resetDayKey();if(!state.fwDone)state.fwDone={};if(document.getElementById('mFW').value==='1')state.fwDone[id]=k;else delete state.fwDone[id];
  const cmd=findCmd(s.commanderId);
  if(cmd){cmd.name=document.getElementById('mcName').value;cmd.cls=document.getElementById('mcCls').value;cmd.rankTitle=document.getElementById('mcRank').value;
    cmd.skillUsed=+document.getElementById('mcSU').value||0;cmd.skillTotal=+document.getElementById('mcST').value||0;
    cmd.xpNeed=+document.getElementById('mcN').value||0;cmd.xpCur=+document.getElementById('mcC').value||0;cmd.xpRem=Math.max(0,cmd.xpNeed-cmd.xpCur);}
  else{clearShipCmd(s);}
  recordDaily();save();closeModal();render();toast('已保存');}
function delShip(id){if(!confirm('确定删除该舰记录？'))return;const i=state.ships.findIndex(s=>s.id===id);if(i>=0)state.ships.splice(i,1);
  const j=state.commanders.findIndex(c=>c.shipId===id);if(j>=0)state.commanders.splice(j,1);
  save();closeModal();render();toast('已删除');}
/* 舰船下拉选项：按 舰队页同样的 系别→级别→自定义顺序 排列，并标出该舰现任舰长 */
function shipPickOpts(sel){
  const ord=s=>{const i=NATION_ORDER.indexOf(natCn(s.nation));return (i<0?99:i)*1000+lvNum(s)*10;};
  return state.ships.slice().sort((a,b)=>ord(a)-ord(b)||((a.seq||0)-(b.seq||0))).map(s=>{
    const cur=findCmd(s.commanderId);
    return '<option value="'+s.id+'" '+(sel===s.id?'selected':'')+'>'+esc(s.name)+'（'+natCn(s.nation)+' '+(s.isSuper?'★':esc(s.level))+'）'+(cur?' · 现任 '+esc(cur.name):'')+'</option>';
  }).join('');
}
function clsOptsHtml(sel){return ['legendary','传奇','special','特殊','normal','普通'].reduce((a,v,i,arr)=>i%2?a:a+'<option value="'+v+'" '+(sel===v?'selected':'')+'>'+arr[i+1]+'</option>','');}
function openCmd(id){const c=findCmd(id);if(!c)return;const ship=c.shipId?findShip(c.shipId):null;
  // 在役舰长的归属只能在「舰船详情 → 更换指挥官」里改，否则会让该舰失去舰长；预备役舰长才允许在这里配舰。
  const shipBlock=ship
    ? '<div class="mod">所在舰船：'+esc(ship.name)+(ship.purchased?'':' <span class="nbtag">未购舰</span>')+'<span style="color:var(--muted);font-size:12px"> （更换归属请到该舰详情页）</span></div>'
    : '<div class="field"><label>所属舰船（当前为预备役，可直接配舰）</label><select id="ccShip"><option value="">预备役 · 暂不配舰</option>'+shipPickOpts(0)+'</select></div>';
  document.getElementById('modalBox').innerHTML='<span class="mclose" onclick="closeModal()">×</span><h3>'+esc(c.name)+' <span class="cbadge '+c.cls+'">'+(c.cls==='legendary'?'传奇':c.cls==='special'?'特殊':'普通')+'</span></h3>'+
    shipBlock+
    '<div class="row2"><div class="field"><label>舰长名</label><input id="ccName" value="'+esc(c.name)+'"></div><div class="field"><label>类别</label><select id="ccCls">'+clsOptsHtml(c.cls)+'</select></div></div>'+
    '<div class="field"><label>军衔</label><input id="ccRank" value="'+esc(c.rankTitle)+'"></div>'+
    '<div class="row2"><div class="field"><label>技能已用</label><input id="ccSU" type="number" value="'+c.skillUsed+'"></div><div class="field"><label>技能总数</label><input id="ccST" type="number" value="'+c.skillTotal+'"></div></div>'+
    '<div class="row2"><div class="field"><label>所需经验</label><input id="ccN" type="number" value="'+c.xpNeed+'"></div><div class="field"><label>现有经验</label><input id="ccC" type="number" value="'+c.xpCur+'"></div></div>'+
    '<div class="mbtn"><button class="save" onclick="saveCmd('+id+')">保存</button><button class="del" onclick="delCmd('+id+')">删除</button><button class="cancel" onclick="closeModal()">取消</button></div>';
  document.getElementById('modal').classList.add('show');}
function saveCmd(id){const c=findCmd(id);if(!c)return;
  c.name=(document.getElementById('ccName').value||'').trim()||c.name;
  c.cls=document.getElementById('ccCls').value;
  c.rankTitle=document.getElementById('ccRank').value;
  c.skillUsed=+document.getElementById('ccSU').value||0;c.skillTotal=+document.getElementById('ccST').value||0;
  c.xpNeed=+document.getElementById('ccN').value||0;c.xpCur=+document.getElementById('ccC').value||0;c.xpRem=Math.max(0,c.xpNeed-c.xpCur);
  const sel=document.getElementById('ccShip');           // 仅预备役舰长有此项
  let moved='';
  if(sel&&sel.value){const s=findShip(parseInt(sel.value));if(s){const old=findCmd(s.commanderId);assignCmd(c,s);moved='，已配属「'+s.name+'」'+(old&&old.id!==c.id?'（'+old.name+' 退回预备役）':'');}}
  const sh=c.shipId?findShip(c.shipId):null;if(sh)syncShipCmd(sh,c);
  recordDaily();save();closeModal();render();toast('已保存'+moved);}
function delCmd(id){const c=findCmd(id);if(!c)return;
  const sh=c.shipId?findShip(c.shipId):null;
  const warn=sh?('（舰船「'+sh.name+'」将解除配属、回到无舰长状态）'):'';
  if(!confirm('确定删除舰长「'+c.name+'」？其经验将从统计中移除。'+warn))return;
  if(sh)clearShipCmd(sh);   // 同步清空舰船上冗余的舰长字段，保持「一舰一舰长」不变式
  const i=state.commanders.findIndex(x=>x.id===id);if(i>=0)state.commanders.splice(i,1);
  recordDaily();save();closeModal();render();toast('已删除舰长'+(sh?('，'+sh.name+' 已解除配属'):''));}

    '<div class="field"><label>还需经验（自动计算）</label><input id="nsRem" type="number" value="0" disabled></div>'+
    '<div class="field"><label>涂装</label><input id="nsCamo" placeholder="选填"></div>'+
    '<hr style="border:none;border-top:1px solid var(--line);margin:14px 0"><h3 style="font-size:14px">舰长</h3>'+
    '<div class="field"><label>配备方式</label><select id="nsCmdMode" onchange="nsCmdModeChange()"><option value="new">新建舰长</option><option value="reserve" '+(reserves.length?'':'disabled')+'>从预备役调配'+(reserves.length?'（'+reserves.length+' 名可用）':'（暂无预备役）')+'</option><option value="none">无舰长（不配备）</option></select></div>'+
    '<div id="nsNewCmd">'+
      '<div class="row2"><div class="field"><label>舰长名</label><input id="nsCName" placeholder="留空则与舰名同名"></div><div class="field"><label>类别</label><select id="nsCCls">'+clsOptsHtml('normal')+'</select></div></div>'+
      '<div class="field"><label>军衔</label><input id="nsCRank" placeholder="选填，例：上校"></div>'+
      '<div class="row2"><div class="field"><label>技能已用</label><input id="nsCSU" type="number" value="0"></div><div class="field"><label>技能总数</label><input id="nsCST" type="number" value="0"></div></div>'+
      '<div class="row2"><div class="field"><label>舰长所需经验</label><input id="nsCN" type="number" value="0"></div><div class="field"><label>舰长现有经验</label><input id="nsCC" type="number" value="0"></div></div>'+
    '</div>'+
    '<div id="nsResCmdBox" style="display:none"><div class="field"><label>选择预备役舰长</label><select id="nsResCmd">'+resOpt+'</select></div></div>'+
    '<div class="mbtn"><button class="save" onclick="saveNewShip()">添加</button><button class="cancel" onclick="closeModal()">取消</button></div>';
  document.getElementById('modal').classList.add('show');
  const n=document.getElementById('nsName');if(n)n.focus();
}
function recalcNewShip(){const n=+document.getElementById('nsNeed').value||0;const c=+document.getElementById('nsCur').value||0;document.getElementById('nsRem').value=Math.max(0,n-c);}
function nsCmdModeChange(){const m=document.getElementById('nsCmdMode').value;
  document.getElementById('nsNewCmd').style.display=(m==='new'?'':'none');
  document.getElementById('nsResCmdBox').style.display=(m==='reserve'?'':'none');}
function saveNewShip(){
  const name=(document.getElementById('nsName').value||'').trim();
  if(!name){toast('请先填写舰名');document.getElementById('nsName').focus();return;}
  const nation=document.getElementById('nsNat').value;
  const type=document.getElementById('nsType').value;
  const lv=document.getElementById('nsLv').value;
  const isSuper=(lv==='★');
  const isPremium=document.getElementById('nsPrem').value==='1';
  const purchased=document.getElementById('nsBuy').value==='1';
  const gun=document.getElementById('nsGun').value.trim();
  const shipModule=document.getElementById('nsMod').value.trim();
  const xpNeed=+document.getElementById('nsNeed').value||0;
  const xpCur=+document.getElementById('nsCur').value||0;
  const camo=document.getElementById('nsCamo').value.trim();
  const mode=document.getElementById('nsCmdMode').value;
  let cmd=null;
  if(mode==='reserve'){
    const sel=document.getElementById('nsResCmd');
    cmd=sel?findCmd(parseInt(sel.value)):null;
    if(!cmd){toast('请选择一名预备役舰长');return;}
  }
  const sid=nextId();
  // 新舰排到「同系别 + 同级别」分组末尾，与舰队页的排序规则一致
  const probe={level:lv,isSuper:isSuper};
  const grp=state.ships.filter(s=>s.nation===nation&&lvNum(s)===lvNum(probe));
  const seq=grp.length?Math.max.apply(null,grp.map(s=>s.seq||0))+1:state.ships.length;
  const ship={id:sid,nation:nation,name:name,isPremium:isPremium,type:type,typeCN:TYPE_CN[type]||type,typeName:TYPE_CN[type]||type,
    gun:gun,level:lv,isSuper:isSuper,shipModule:shipModule,fullyUpgraded:(!shipModule&&!xpNeed&&!xpCur),
    xpNeed:xpNeed,xpCur:xpCur,xpRem:Math.max(0,xpNeed-xpCur),
    cmdName:'',cmdClass:'normal',rankTitle:'',skillUsed:0,skillTotal:0,isElite:false,
    cmdXpNeed:0,cmdXpCur:0,cmdXpRem:0,firstWin:false,purchased:purchased,camo:camo,col:0,commanderId:0,seq:seq};
  state.ships.push(ship);
  if(mode==='new'){
    const cn=(document.getElementById('nsCName').value||'').trim()||name;
    const need=+document.getElementById('nsCN').value||0;
    const cur=+document.getElementById('nsCC').value||0;
    cmd={id:nextId(),shipId:sid,name:cn,cls:document.getElementById('nsCCls').value,
      rankTitle:document.getElementById('nsCRank').value.trim(),
      skillUsed:+document.getElementById('nsCSU').value||0,skillTotal:+document.getElementById('nsCST').value||0,
      xpNeed:need,xpCur:cur,xpRem:Math.max(0,need-cur)};
    state.commanders.push(cmd);
  }else if(mode==='reserve'){
    cmd.shipId=sid;
  }
  if(cmd)syncShipCmd(ship,cmd);
  recordDaily();save();closeModal();
  state._f=state._f||{};state._f.q='';state._f.nat='';state._f.status='';
  switchView('fleet');
  let nsMsg='已添加「'+name+'」';
  if(mode==='reserve')nsMsg+='，舰长：'+cmd.name+'（预备役调入）';
  else if(mode==='new')nsMsg+='，并新建舰长「'+cmd.name+'」';
  else nsMsg+='（无舰长）';
  toast(nsMsg);
}

/* ---------- 新增舰长（可直接配舰，也可留在预备役） ---------- */
function openNewCmd(){
  document.getElementById('modalBox').innerHTML='<span class="mclose" onclick="closeModal()">×</span><h3>新增舰长</h3>'+
    '<div class="row2"><div class="field"><label>舰长名 *</label><input id="ncName" placeholder="例：山本五十六" autocomplete="off"></div><div class="field"><label>类别</label><select id="ncCls">'+clsOptsHtml('normal')+'</select></div></div>'+
    '<div class="field"><label>军衔</label><input id="ncRank" placeholder="选填，例：上校"></div>'+
    '<div class="row2"><div class="field"><label>技能已用</label><input id="ncSU" type="number" value="0"></div><div class="field"><label>技能总数</label><input id="ncST" type="number" value="0"></div></div>'+
    '<div class="row2"><div class="field"><label>所需经验</label><input id="ncN" type="number" value="0"></div><div class="field"><label>现有经验</label><input id="ncC" type="number" value="0"></div></div>'+
    '<div class="field"><label>所属舰船</label><select id="ncShip"><option value="">预备役 · 暂不配舰</option>'+shipPickOpts(0)+'</select>'+
      '<div style="color:var(--muted);font-size:12px;margin-top:4px">选定舰船后，该舰原舰长会自动退回预备役（不会被删除）。</div></div>'+
    '<div class="mbtn"><button class="save" onclick="saveNewCmd()">添加</button><button class="cancel" onclick="closeModal()">取消</button></div>';
  document.getElementById('modal').classList.add('show');
  const n=document.getElementById('ncName');if(n)n.focus();
}
function saveNewCmd(){
  const name=(document.getElementById('ncName').value||'').trim();
  if(!name){toast('请先填写舰长名');document.getElementById('ncName').focus();return;}
  const need=+document.getElementById('ncN').value||0;
  const cur=+document.getElementById('ncC').value||0;
  const c={id:nextId(),shipId:null,name:name,cls:document.getElementById('ncCls').value,
    rankTitle:document.getElementById('ncRank').value.trim(),
    skillUsed:+document.getElementById('ncSU').value||0,skillTotal:+document.getElementById('ncST').value||0,
    xpNeed:need,xpCur:cur,xpRem:Math.max(0,need-cur)};
  state.commanders.push(c);
  let extra='（预备役）';
  const v=document.getElementById('ncShip').value;
  if(v){const s=findShip(parseInt(v));if(s){const old=findCmd(s.commanderId);assignCmd(c,s);extra='，已配属「'+s.name+'」'+(old&&old.id!==c.id?'（'+old.name+' 退回预备役）':'');}}
  recordDaily();save();closeModal();
  state._cf=state._cf||{};state._cf.q='';state._cf.cls='';state._cf.own='';
  switchView('commanders');
  toast('已新增舰长「'+name+'」'+extra);
}
function closeModal(){document.getElementById('modal').classList.remove('show');}

/* ---------- render ---------- */
function switchView(v){curView=v;document.querySelectorAll('nav#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render();}
function render(){try{CHARTS=[];
  if(curView==='fleet')renderFleet();
  else if(curView==='commanders')renderCommanders();
  else if(curView==='assets')renderAssets();
  else if(curView==='overview')renderOverview();
  else if(curView==='focus')renderFocus();
  bindCharts();
  // backup hint
  const total=state.ships.length;const hint=document.getElementById('bkhint');
  if(total>=30&&hint)hint.textContent='数据已积累 '+total+' 条，建议点「导出 JSON」定期备份。';
}catch(err){console.error(err);toast('渲染出错（已自动隔离）：'+err.message);}}
/* 就地重绘当前视图并保持滚动位置：用于勾选首胜、拖动图表等“不该切板块/不该跳顶”的场景 */
function rerender(){
  const y=window.pageYOffset||document.documentElement.scrollTop||0;
  render();
  window.scrollTo(0,y);
}
window.switchView=switchView;window.openShip=openShip;window.openCmd=openCmd;window.closeModal=closeModal;
window.toggleFW=toggleFW;window.addFollow=addFollow;window.unfollow=unfollow;window.swapCmd=swapCmd;window.recalcShip=recalcShip;
window.fsFilter=fsFilter;window.fsKey=fsKey;window.fsClear=fsClear;
window.setRange=setRange;window.panRange=panRange;window.rerender=rerender;
window.openNewShip=openNewShip;window.saveNewShip=saveNewShip;window.recalcNewShip=recalcNewShip;window.nsCmdModeChange=nsCmdModeChange;
window.openNewCmd=openNewCmd;window.saveNewCmd=saveNewCmd;window.delCmd=delCmd;
window.saveShip=saveShip;window.delShip=delShip;window.saveCmd=saveCmd;window.exportJSON=exportJSON;window.importJSON=importJSON;window.clearAll=clearAll;window.editAsset=editAsset;
window.onDragStart=onDragStart;window.onDragOver=onDragOver;window.onDragLeave=onDragLeave;window.onDrop=onDrop;window.onDragEnd=onDragEnd;
window.switchAccount=switchAccount;window.newAccount=newAccount;window.renameAccount=renameAccount;window.deleteAccount=deleteAccount;window.boot=boot;
document.querySelector('nav#tabs button[data-v="fleet"]').classList.add('active');
boot();
</script>
